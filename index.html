<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DoulinComida</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
           font-family: system-ui, -apple-system, sans-serif; background: #FFF8F0; color: #1F1B16; text-align: center; }
    h1 { font-size: 22px; }
    a { color: #E4572E; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <p style="font-size: 56px; margin: 0">🍳</p>
    <h1 id="title">Regresando a DoulinComida…</h1>
    <p id="msg"></p>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var next = params.get("next") || "";

      // Solo se permite regresar a la app, nunca a otro sitio web
      if (!/^(exp|doulincomida):\/\//.test(next)) {
        document.getElementById("title").textContent = "Enlace inválido";
        return;
      }

      params.delete("next");
      var query = params.toString();
      var target = next + (query ? (next.indexOf("?") === -1 ? "?" : "&") + query : "") + location.hash;

      location.replace(target);

      // Por si el navegador no regresa solo
      var link = document.createElement("a");
      link.href = target;
      link.textContent = "Toca aquí para volver a la app";
      document.getElementById("msg").appendChild(link);
    })();
  </script>
</body>
</html>
